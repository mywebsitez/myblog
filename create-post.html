<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Post | EdwinBlog</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="header">
      <div class="container nav-container">
        <div class="logo">Edwin<span>Blog</span></div>

        <nav class="navbar">
          <a href="index.html">Home</a>
          <a href="index.html#blog">Blog</a>
          <a href="index.html#categories"> Categories </a>
        </nav>
      </div>
    </header>

    <!-- CREATE POST -->

    <section class="create-post">
      <div class="create-container">
        <p class="section-label">ADMIN</p>

        <h1>Create New Post</h1>

        <p class="create-description">
          Write and publish a new article on EdwinBlog.
        </p>

        <form id="postForm">
          <!-- TITLE -->

          <label for="postTitle"> Post Title </label>

          <input
            type="text"
            id="postTitle"
            placeholder="Enter your post title"
            required
          />

          <!-- CATEGORY -->

          <label for="postCategory"> Category </label>

          <select id="postCategory" required>
            <option value="">Select category</option>

            <option value="Technology">Technology</option>

            <option value="Business">Business</option>

            <option value="Lifestyle">Lifestyle</option>

            <option value="Education">Education</option>

            <option value="Coding">Coding</option>

            <option value="Social Media">Social Media</option>
          </select>

          <!-- IMAGE -->

          <label for="postImage"> Featured Image URL </label>

          <input
            type="url"
            id="postImage"
            placeholder="https://example.com/image.jpg"
          />

          <!-- DESCRIPTION -->

          <label for="postDescription"> Short Description </label>

          <textarea
            id="postDescription"
            rows="4"
            placeholder="Write a short description..."
            required
          ></textarea>

          <!-- ARTICLE -->

          <label for="postContent"> Article Content </label>

          <textarea
            id="postContent"
            rows="12"
            placeholder="Write your article here..."
            required
          ></textarea>

          <!-- BUTTON -->

          <button type="submit" class="publish-btn">Publish Post</button>
        </form>

        <div id="message"></div>
      </div>
    </section>

    <footer>
      <div class="container footer-content">
        <div class="logo">Edwin<span>Blog</span></div>

        <p>© 2026 EdwinBlog. All Rights Reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
